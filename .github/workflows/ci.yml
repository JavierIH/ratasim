name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  robot:
    # Each robot in the OSHWDEM 2026 maze with its own firmware, as tests/robots.py checks it (its docstring says what
    # passes). ZoroBot3's STEP is not in the repository: there, only its firmware is built.
    name: ${{ matrix.robot }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        robot: [ratatron, zorobot, gamusino, bulebule, nezumibot, perenquen, fujin, futura, ukmarsbot]
    steps:
      - uses: actions/checkout@v4
      # The submodules one level deep, by hand: perenquen's has a submodule with no URL (KiCad_BOM_Wizard), on which
      # actions/checkout's own recursion fails. Bulebule's firmware needs two of its own (not its libopencm3: the
      # simulator brings its own).
      - run: |
          git submodule update --init
          git -C external/bulebule submodule update --init src/mmlib src/printf
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # gmsh (Bulebule's parts from KiCad's STEP models, Fujin's meshes from its STEP) needs these X and GL libraries
      # even without a screen; EGL: the runners of ZoroBot3, Gamusino, NezumiBot, Perenquén, Fujin, Futura and
      # UKMARSBOT pick MuJoCo's EGL renderer, loaded on import
      - run: >-
          sudo apt-get update -q && sudo apt-get install -y -q libglu1-mesa libxrender1 libxcursor1 libxft2
          libxinerama1 libegl1 libgl1
      - run: pip install -e ".[cad]"
      - run: python tests/robots.py ${{ matrix.robot }}
